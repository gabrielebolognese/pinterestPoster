name: post-to-pinterest

on:
  schedule:
    # UTC times. Pins are due 10:00 to 13:00 Italian time, which is 08:00 to 12:00 UTC across summer and winter time.
    - cron: '7,37 8-12 * * *'
    # Two later runs retry a pin that failed in the morning.
    - cron: '7 15,19 * * *'
  workflow_dispatch: # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:
  group: post-to-pinterest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post due pins
        run: node post.mjs
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}

      # always() so a posted pin leaves queue/ even if another pin failed
      - name: Save queue state
        if: always()
        run: |
          git config user.name "pinterest-autopost"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in queue posted failed; do
            if [ -e "$d" ]; then git add -A "$d"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "autopost: update queue"
            git pull --rebase
            git push
          fi
